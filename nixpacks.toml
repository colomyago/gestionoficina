[phases.setup]
nixPkgs = ['php82', 'php82Extensions.intl', 'php82Extensions.zip', 'php82Extensions.pdo_mysql', 'php82Extensions.redis', 'php82Extensions.sodium']

[phases.install]
cmds = ['composer install --optimize-autoloader --no-interaction --ignore-platform-reqs']

[phases.build]
cmds = ['php artisan filament:upgrade']

[start]
cmd = 'php artisan serve --host=0.0.0.0 --port=${PORT:-8000}'
